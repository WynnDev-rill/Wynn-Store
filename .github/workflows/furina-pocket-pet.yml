name: Furina Pocket Pet Android
on:
  push:
    paths: ['furina-pocket-pet/**', '.github/workflows/furina-pocket-pet.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish only after Live2D/model licensing approval and stable signing secrets are configured'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: furina-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify pinned development dependencies
        run: python3 furina-pocket-pet/scripts/prepare-deps.py --accept-sdk-license
      - name: Unit tests, lint and native debug build
        run: ./furina-pocket-pet/gradlew -p furina-pocket-pet :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 native renderer and overlay lifecycle tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash furina-pocket-pet/qa/run-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Furina-test-results
          path: |
            furina-pocket-pet/app/build/reports/tests/
            furina-pocket-pet/app/build/reports/lint-results-release*
            furina-pocket-pet/qa/output/*.txt
      # SDK + importable model renderer is an Expandable Application. No public APK upload by default.
  publish:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.FURINA_PUBLICATION_APPROVED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 furina-pocket-pet/scripts/prepare-deps.py --accept-sdk-license
      - name: Restore original signing identity
        env:
          FP_KEYSTORE_B64: ${{ secrets.FP_KEYSTORE_B64 }}
        run: |
          test -n "$FP_KEYSTORE_B64"
          mkdir -p furina-pocket-pet/signing
          printf '%s' "$FP_KEYSTORE_B64" | base64 --decode > furina-pocket-pet/signing/furina-release.jks
      - name: Build and publish immutable signed APK
        env:
          FP_STORE_PASSWORD: ${{ secrets.FP_STORE_PASSWORD }}
          FP_KEY_PASSWORD: ${{ secrets.FP_KEY_PASSWORD }}
          FP_KEY_ALIAS: furina
          GH_TOKEN: ${{ github.token }}
        run: python3 furina-pocket-pet/scripts/publish.py
