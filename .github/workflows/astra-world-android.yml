name: Astra World Android
on:
  workflow_dispatch:
  push:
    branches: [astra-world]
    paths: ['astra-world/**', '.github/workflows/astra-world-android.yml']
permissions:
  contents: read
concurrency:
  group: astra-world-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Godot and render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils xdotool
          mkdir -p /tmp/astra-toolchain ~/.local/share/godot/export_templates/4.6.1.stable
          cd /tmp/astra-toolchain
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          echo "cecd0cb6b55e931318a9d7237dc4197d69ea914966787a454808523626e2789f  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64
          sudo ln -s "$PWD/Godot_v4.6.1-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          echo "e6d372afd4fdfaae9571eb5e3568afcd96ce6db9a569244034154faf0ac69875  templates.tpz" | sha256sum -c -
          unzip -j -q templates.tpz templates/android_release.apk templates/android_debug.apk -d ~/.local/share/godot/export_templates/4.6.1.stable
          sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - name: Import and validate source
        working-directory: astra-world
        run: |
          mkdir -p build evidence
          godot --headless --editor --import --path . 2>&1 | tee evidence/import.log
          python3 tools/check_log.py evidence/import.log
          godot --headless --verbose --path . --quit-after 30 2>&1 | tee evidence/startup.log
          python3 tools/check_log.py evidence/startup.log
      - name: Configure Android export
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export release APK
        id: export
        working-directory: astra-world
        run: |
          godot --headless --path . --export-release Android build/Astra-World-unsigned.apk 2>&1 | tee evidence/export.log
          test -s build/Astra-World-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/Astra-World-unsigned.apk > evidence/package.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/apksigner.jar
          git rev-parse HEAD > evidence/source-commit.txt
          keytool -genkeypair -keystore /tmp/astra-qa.jks -storepass android -keypass android -alias qa -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Astra CI QA' -noprompt
          java -jar build/apksigner.jar sign --ks /tmp/astra-qa.jks --ks-key-alias qa --ks-pass pass:android --out build/Astra-World-test.apk build/Astra-World-unsigned.apk
      - name: Rendered input playthrough
        id: playthrough
        working-directory: astra-world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' timeout 1000 godot --path . --audio-driver Dummy -- --qa 2>&1 | tee evidence/playthrough.log
          python3 tools/check_log.py evidence/playthrough.log
          python3 -c "import json; assert json.load(open('evidence/playthrough.json'))['passed']"
      - name: Enable Android virtualization
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installed APK touch and lifecycle verification
        if: ${{ !cancelled() && steps.export.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd astra-world && python3 tests/android_smoke.py
      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Astra-World-build
          path: |
            astra-world/build/
            astra-world/evidence/
          retention-days: 14
