name: Road to Immortal data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - 'road-to-immortal/pipeline/**'
      - '.github/workflows/road-to-immortal-data.yml'
permissions:
  contents: write
concurrency:
  group: road-to-immortal-data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: road-to-immortal/pipeline/.cache
          key: rti-data-v1-${{ github.run_id }}
          restore-keys: rti-data-v1-
      - name: Refresh and validate public sources
        run: python road-to-immortal/pipeline/sync.py
      - name: Publish validated snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'Road to Immortal data'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add road-to-immortal/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(rti): refresh verified MLBB snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rti-data
          include-hidden-files: true
          path: |
            road-to-immortal/data/
            road-to-immortal/pipeline/.cache/
          retention-days: 7
