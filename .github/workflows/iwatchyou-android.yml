name: IWatchYou Android
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'iwatchyou/**'
      - '.github/workflows/iwatchyou-android.yml'
      - 'screenguard-pro/gradle/**'
      - 'screenguard-pro/gradlew'
  push:
    branches: [main]
    paths:
      - 'iwatchyou/**'
      - '.github/workflows/iwatchyou-android.yml'
      - 'screenguard-pro/gradle/**'
      - 'screenguard-pro/gradlew'
      - '!iwatchyou/updates/**'
      - '!iwatchyou/docs/**'
permissions:
  contents: read
concurrency:
  group: iwatchyou-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      staged: ${{ steps.version.outputs.staged }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify device-QA outcome detection
        run: python3 -m unittest discover -s iwatchyou/qa -p 'test_*.py' -v
      - id: version
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,re
          version=re.search(r'versionName = "([0-9.]+)"',pathlib.Path('iwatchyou/app/build.gradle.kts').read_text()).group(1)
          staged=pathlib.Path('iwatchyou/distribution/IWatchYou-'+version+'.apk').is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('staged='+str(staged).lower()+'\n')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and optimized APKs
        run: ./screenguard-pro/gradlew -p iwatchyou :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assemblePreview :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IWatchYou-build
          path: |
            iwatchyou/app/build/outputs/apk/
            iwatchyou/app/build/reports/
            iwatchyou/app/build/test-results/
            iwatchyou/app/build/outputs/mapping/release/
  device:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: IWatchYou-build
          path: iwatchyou/app/build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native instrumentation and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            bash iwatchyou/qa/run-device.sh
            bash iwatchyou/qa/run-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IWatchYou-device-api-${{ matrix.api }}
          path: iwatchyou/qa/output/
  production:
    needs: [build, device]
    if: github.ref == 'refs/heads/main' && needs.build.outputs.staged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Production smoke, verified publication, then live in-app upgrade
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash iwatchyou/qa/release-and-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IWatchYou-production-and-upgrade
          path: |
            iwatchyou/qa/production-output/
            iwatchyou/qa/upgrade-output/
