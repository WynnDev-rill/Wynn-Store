name: IWatchYou Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'iwatchyou/**'
      - '.github/workflows/iwatchyou-android.yml'
      - '!iwatchyou/updates/**'
      - '!iwatchyou/docs/**'
permissions:
  contents: read
concurrency:
  group: iwatchyou-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      staged: ${{ steps.version.outputs.staged }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,re
          version=re.search(r'versionName = "([0-9.]+)"',pathlib.Path('iwatchyou/app/build.gradle.kts').read_text()).group(1)
          staged=pathlib.Path('iwatchyou/distribution/IWatchYou-'+version+'.apk').is_file()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('staged='+str(staged).lower()+'\n')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.staged != 'true'
      - name: Unit tests, lint and optimized APKs
        if: steps.version.outputs.staged != 'true'
        run: ./screenguard-pro/gradlew -p iwatchyou :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always() && steps.version.outputs.staged != 'true'
        with:
          name: IWatchYou-build
          path: |
            iwatchyou/app/build/outputs/apk/
            iwatchyou/app/build/reports/
            iwatchyou/app/build/test-results/
            iwatchyou/app/build/outputs/mapping/release/
      - name: Verify staged production APK and publish
        if: steps.version.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 iwatchyou/scripts/publish.py
        # Only this step needs release writes; job permissions are set below.
    permissions:
      contents: write
  device:
    needs: build
    if: needs.build.outputs.staged != 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [30, 36]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: IWatchYou-build
          path: iwatchyou/app/build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native instrumentation and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash iwatchyou/qa/run-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IWatchYou-device-api-${{ matrix.api }}
          path: iwatchyou/qa/output/
