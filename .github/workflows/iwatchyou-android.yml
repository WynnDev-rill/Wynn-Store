name: IWatchYou — Build and publish Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'iwatchyou/**'
      - '.github/workflows/iwatchyou-android.yml'
      - '!iwatchyou/updates/**'

permissions:
  contents: write
concurrency:
  group: iwatchyou-release
  cancel-in-progress: false
jobs:
  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: screenguard-release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./screenguard-pro/gradlew -p iwatchyou :app:testDebugUnitTest --stacktrace
      - name: Require existing protected production signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.SG_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/iwatchyou-release.jks"
      - name: Build signed APK
        env:
          IW_KEYSTORE_PATH: ${{ runner.temp }}/iwatchyou-release.jks
          IW_STORE_PASSWORD: ${{ secrets.SG_STORE_PASSWORD }}
          IW_KEY_ALIAS: ${{ secrets.SG_KEY_ALIAS }}
          IW_KEY_PASSWORD: ${{ secrets.SG_KEY_PASSWORD }}
        run: |
          ./screenguard-pro/gradlew -p iwatchyou :app:assembleRelease --stacktrace
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs iwatchyou/app/build/outputs/apk/release/app-release.apk
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IWatchYou-1.0.0-signed
          path: iwatchyou/app/build/outputs/apk/release/app-release.apk
      - name: Publish release and update metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 iwatchyou/scripts/publish.py
      - name: Remove transient signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/iwatchyou-release.jks"
