name: Lunabloom browser QA
on:
  push:
    paths:
      - '.github/workflows/lunabloom-browser-qa.yml'
      - 'lunabloom-ready-board/tests/browser-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        working-directory: lunabloom-ready-board
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory lunabloom-ready-board > /tmp/lunabloom-http.log 2>&1 &
          sleep 2
      - name: Test desktop and mobile interactions
        run: node lunabloom-ready-board/tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lunabloom-responsive-screenshots
          path: qa-screenshots/
          retention-days: 5
