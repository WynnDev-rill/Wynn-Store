name: ScreenGuard Pro Android
on:
  workflow_dispatch:
  push:
    paths: ['screenguard-pro/**', '!screenguard-pro/updates/**', '.github/workflows/screenguard-android.yml']
permissions:
  contents: read
concurrency:
  group: screenguard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: screenguard-pro
    steps:
      - uses: actions/checkout@v4
      - name: Read release version
        id: version
        run: |
          python3 - <<'PYCODE'
          import os,pathlib,re
          version=re.search(r'versionName = "([0-9.]+)"',pathlib.Path('app/build.gradle.kts').read_text()).group(1)
          apk='distribution/ScreenGuard-Pro-'+version+'.apk'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('apk='+apk+'\nstaged='+str(pathlib.Path(apk).is_file()).lower()+'\n')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.staged != 'true'
      # User requested direct device testing: compile and signing checks only for this release.
      - name: Build release APK for user testing
        if: steps.version.outputs.staged != 'true'
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload unsigned release
        if: steps.version.outputs.staged != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ScreenGuard-unsigned
          path: screenguard-pro/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify original production signature and publish update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SG_APK_PATH: ${{ steps.version.outputs.apk }}
        run: python3 scripts/publish-release.py
