name: ArithMemo Android verification
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths: ['arithmemo/**', '.github/workflows/arithmemo-*.yml']
  pull_request:
    paths: ['arithmemo/**', '.github/workflows/arithmemo-*.yml']
permissions:
  contents: read
concurrency:
  group: arithmemo-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Android lint and APK compilation
        working-directory: arithmemo
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArithMemo-build
          path: |
            arithmemo/app/build/outputs/apk/
            arithmemo/app/build/reports/
            arithmemo/app/build/test-results/
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: ArithMemo-build
          path: arithmemo/app/build
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: false
          script: bash arithmemo/qa/run-device.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArithMemo-device-${{ matrix.api }}
          path: arithmemo/qa/output/
