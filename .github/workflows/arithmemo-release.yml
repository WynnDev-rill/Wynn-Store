name: ArithMemo signed GitHub Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arithmemo-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/arithmemo-android.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private production key
        env:
          KEYSTORE: ${{ secrets.AM_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo '::error::AM_KEYSTORE_BASE64 is missing. Configure production signing secrets; no debug fallback is allowed.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/arithmemo.p12"
      - name: Build signed production APK
        working-directory: arithmemo
        env:
          AM_KEYSTORE_PATH: ${{ runner.temp }}/arithmemo.p12
          AM_STORE_PASSWORD: ${{ secrets.AM_STORE_PASSWORD }}
          AM_KEY_ALIAS: ${{ secrets.AM_KEY_ALIAS }}
          AM_KEY_PASSWORD: ${{ secrets.AM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Verify certificate and publish release
        working-directory: arithmemo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/prepare-release.py app/build/outputs/apk/release/app-release.apk
          python3 tools/publish-release.py --stage
      - name: Enable KVM for actual production upgrade
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GitHub download, Android installation and data retention
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UPDATE_MANIFEST_FILE: distribution/update.json
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          disable-animations: false
          script: bash arithmemo/qa/run-upgrade.sh
      - name: Activate verified stable release
        working-directory: arithmemo
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish-release.py --activate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ArithMemo-signed-release
          path: |
            arithmemo/distribution/
            arithmemo/app/build/outputs/mapping/release/
            arithmemo/qa/output/upgrade/
      - name: Remove temporary signing material
        if: always()
        run: python3 -c "from pathlib import Path; Path('${{ runner.temp }}/arithmemo.p12').unlink(missing_ok=True)"
