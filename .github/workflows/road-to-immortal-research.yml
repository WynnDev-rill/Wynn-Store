name: RTI integration research
on:
  push:
    branches: [road-to-immortal]
    paths:
      - road-to-immortal/pipeline/probe.py
      - .github/workflows/road-to-immortal-research.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python road-to-immortal/pipeline/probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: rti-source-probe
          path: probe-output/
          retention-days: 7
