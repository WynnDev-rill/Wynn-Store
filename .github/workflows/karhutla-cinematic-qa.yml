name: Kalimantan cinematic QA
on:
  pull_request:
    paths: ['karhutla-kalimantan/**', '.github/workflows/karhutla-cinematic-qa.yml']
  push:
    branches: [main]
    paths: ['karhutla-kalimantan/**', '.github/workflows/karhutla-cinematic-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: karhutla-kalimantan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: karhutla-kalimantan/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test && npm run build
      - run: npm run test:cinematic
      - run: npm run test:weather
      - run: npm run test:browser
      - run: npm run test:accessibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalimantan-visual-qa
          path: karhutla-kalimantan/test-results/
