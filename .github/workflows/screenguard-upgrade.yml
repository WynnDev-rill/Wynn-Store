name: ScreenGuard Pro production updater
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/screenguard-upgrade.yml', 'screenguard-pro/qa/run-upgrade.sh', 'screenguard-pro/app/src/androidTest/java/id/wynn/screenguard/ProductionUpgradeTest.kt']
permissions:
  contents: read
jobs:
  installed-production-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile updater device tests
        working-directory: screenguard-pro
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real production 1.2 updater and Android installation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash screenguard-pro/qa/run-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-updater-evidence
          path: |
            screenguard-pro/qa/output/
            screenguard-pro/screenshots/
            screenguard-pro/dist/production/
